<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GoFresh Sales Dashboard</title>
<style>
  :root {
    --brand-green: #16a34a;
    --brand-teal: #0f766e;
    --brand-orange: #f97316;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: drag;
    user-select: none;
  }
  #card {
    width: 420px; height: 420px;
    margin: 20px auto 0;
    border-radius: 20px;
    background: linear-gradient(160deg, #0f766e 0%, #115e46 55%, #0b3d2e 100%);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative;
    overflow: hidden;
  }
  #card::before {
    content: '';
    position: absolute;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(249,115,22,.28) 0%, rgba(249,115,22,0) 70%);
    top: -110px; right: -90px;
  }
  #card::after {
    content: '';
    position: absolute;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(22,163,74,.30) 0%, rgba(22,163,74,0) 70%);
    bottom: -100px; left: -80px;
  }
  #logoWrap {
    width: 96px; height: 96px;
    border-radius: 22px;
    background: rgba(255,255,255,.96);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 22px rgba(0,0,0,.35);
    margin-bottom: 22px;
    z-index: 2;
  }
  #logoWrap img { width: 74px; height: 74px; object-fit: contain; }

  #ringWrap {
    position: relative;
    width: 132px; height: 132px;
    z-index: 2;
    margin-bottom: 20px;
  }
  svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: rgba(255,255,255,.14); stroke-width: 8; }
  .ring-fg {
    fill: none; stroke: var(--brand-orange); stroke-width: 8;
    stroke-linecap: round;
    transition: stroke-dashoffset .35s ease, stroke .3s ease;
  }
  .ring-fg.indeterminate {
    stroke-dasharray: 60 320 !important;
    animation: spin 1.1s linear infinite;
    transition: none;
  }
  @keyframes spin {
    to { transform: rotate(270deg); }
  }
  #ringWrap svg.spinning {
    animation: spinwrap 1.1s linear infinite;
    transform-origin: 50% 50%;
  }
  @keyframes spinwrap {
    from { transform: rotate(-90deg); }
    to { transform: rotate(270deg); }
  }
  #pct {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 700; color: #fff;
    letter-spacing: .5px;
    font-variant-numeric: tabular-nums;
  }

  #title {
    color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .3px;
    z-index: 2; margin-bottom: 4px;
  }
  #status {
    color: rgba(255,255,255,.72); font-size: 12.5px;
    z-index: 2; min-height: 16px;
    max-width: 320px; text-align: center;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #tagline {
    position: absolute; bottom: 22px; left: 0; right: 0;
    text-align: center; font-size: 10.5px; letter-spacing: 1.5px;
    text-transform: uppercase; color: rgba(255,255,255,.4); z-index: 2;
  }

  body.fade-out #card { animation: fadeOut .28s ease forwards; }
  @keyframes fadeOut {
    to { opacity: 0; transform: scale(.97); }
  }
</style>
</head>
<body>
  <div id="card">
    <div id="logoWrap"><img src="gofresh_logo_transparent.png" alt="GoFresh"></div>
    <div id="ringWrap">
      <svg viewBox="0 0 132 132" width="132" height="132">
        <circle class="ring-bg" cx="66" cy="66" r="58"></circle>
        <circle class="ring-fg" id="ringFg" cx="66" cy="66" r="58"
                stroke-dasharray="364.4" stroke-dashoffset="364.4"></circle>
      </svg>
      <div id="pct">0%</div>
    </div>
    <div id="title">GoFresh Analytics</div>
    <div id="status">Starting up…</div>
    <div id="tagline">Only the best is fresh</div>
  </div>

  <script>
    const ringFg = document.getElementById('ringFg');
    const ringSvg = ringFg.closest('svg');
    const pctLabel = document.getElementById('pct');
    const statusLabel = document.getElementById('status');
    const CIRCUMFERENCE = 2 * Math.PI * 58; // ~364.4

    function setIndeterminate(status) {
      ringFg.classList.add('indeterminate');
      ringSvg.classList.add('spinning');
      pctLabel.textContent = '';
      statusLabel.textContent = status || 'Working…';
    }

    function setPercent(percent, status) {
      ringFg.classList.remove('indeterminate');
      ringSvg.classList.remove('spinning');
      const clamped = Math.max(0, Math.min(100, percent));
      const offset = CIRCUMFERENCE * (1 - clamped / 100);
      ringFg.style.strokeDashoffset = String(offset);
      pctLabel.textContent = clamped + '%';
      if (status) statusLabel.textContent = status;
    }

    window.splashAPI.onProgress(({ percent, status }) => {
      if (percent === null || percent === undefined) {
        setIndeterminate(status);
      } else {
        setPercent(percent, status);
      }
    });

    window.splashAPI.onDone(() => {
      document.body.classList.add('fade-out');
    });
  </script>
</body>
</html>
